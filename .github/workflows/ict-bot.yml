name: ICT 5m Signal Bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run ICT bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: python ict_bot_cron.py
      - name: Save state
        run: |
          git config user.name "ict-bot"
          git config user.email "ict-bot@users.noreply.github.com"
          git add signals.json
          git diff --staged --quiet || git commit -m "update signal state [skip ci]"
          git push
